name: Build dashboard showcase

on:
  push:
    branches: [main]
    paths:
      - app.py
      - 'src/**'
      - 'tests/**'
      - 'data/**'
      - '.streamlit/**'
      - 'requirements*.txt'
      - '.github/workflows/build-showcase.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-dashboard-showcase
  cancel-in-progress: false

jobs:
  showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-automation.txt
      - name: Install dependencies and browser
        run: |
          python -m pip install -r requirements-automation.txt
          python -m playwright install --with-deps chromium
      - name: Validate observations and calculation safeguards
        run: |
          python -m src.data_model
          python -m unittest discover -s tests
      - name: Render the dashboard
        run: python -m src.capture_dashboard
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-preview-${{ github.run_id }}
          path: Screenshot/dashboard.png
          retention-days: 14
      - name: Publish the verified preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Screenshot/dashboard.png
          if ! git diff --cached --quiet; then
            git commit -m "Update Air Passenger Atlas dashboard preview"
            git push origin HEAD:main
          fi
